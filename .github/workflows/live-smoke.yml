name: ENTEGO LIVE SMOKE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-production:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BASE_URL: https://entego-pwa.ardarawk.workers.dev
      EXPECTED_CACHE: entego-v92
      EXPECTED_BOOT: ENTEGO_BOOT_VERSION='92'
    steps:
      - name: Wait for ENTEGO v92 production state
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            index="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/" 2>/dev/null || true)"
            sw="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/sw.js" 2>/dev/null || true)"
            loader="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/route-loader-flow.js?v=92" 2>/dev/null || true)"
            health="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/api/health" 2>/dev/null || true)"
            privacy="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/privacy.html" 2>/dev/null || true)"
            removal="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/account-removal.html" 2>/dev/null || true)"
            legal="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/legal.html" 2>/dev/null || true)"
            if grep -Fq "$EXPECTED_BOOT" <<<"$index"               && grep -Fq "$EXPECTED_CACHE" <<<"$sw"               && grep -Fq "RL_VERSION='92'" <<<"$loader"               && grep -Fq '"version":"v64"' <<<"$health"               && grep -Fq 'admin-reviewed-delete-anonymize-v2' <<<"$health"               && grep -Fq 'Kebijakan Privasi ENTEGO' <<<"$privacy"               && grep -Fq 'PT NADMO STUDIO INDONESIA' <<<"$privacy"               && grep -Fq 'Penghapusan Akun ENTEGO' <<<"$removal"               && grep -Fq 'Informasi Legal ENTEGO' <<<"$legal"; then
              echo "LIVE_V92_CORE=PASS"
              exit 0
            fi
            echo "Attempt $attempt/24: production is still converging to v92/v64"
            sleep 5
          done
          echo "Production did not converge to ENTEGO v92 / API v64"
          exit 1

      - name: Verify public endpoints and privacy resources
        shell: bash
        run: |
          set -euo pipefail
          for path in /privacy.html /account-removal.html /legal.html /api/health /api/identity/config; do
            code="$(curl -sS -o /tmp/entego.out -w '%{http_code}' --connect-timeout 8 --max-time 15 "$BASE_URL$path")"
            test "$code" = "200"
            echo "$path HTTP $code"
          done
          curl -fsS "$BASE_URL/api/identity/config" | grep -Fq '"documentsPublic":false'
          curl -fsS "$BASE_URL/api/identity/config" | grep -Fq '"payoutGate":"identity-approved-required"'
          echo "PUBLIC_PRIVACY_IDENTITY_ENDPOINTS=PASS"

      - name: Verify public directory
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/directory.json -w '%{http_code}' --connect-timeout 8 --max-time 15 "$BASE_URL/api/directory")"
          test "$code" = "200"
          grep -Fq '"ok":true' /tmp/directory.json
          echo "PUBLIC_DIRECTORY=PASS"
