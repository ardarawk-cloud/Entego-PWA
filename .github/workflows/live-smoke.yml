name: ENTEGO LIVE SMOKE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-production:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      BASE_URL: https://entego-pwa.ardarawk.workers.dev
      EXPECTED_CACHE: entego-v67
      EXPECTED_ROUTE_MARKER: route-loader-flow.js?v=67
    steps:
      - name: Wait for v67 production marker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            sw="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/sw.js" 2>/dev/null || true)"
            if grep -q "$EXPECTED_CACHE" <<<"$sw"; then
              echo "Production service worker exposes $EXPECTED_CACHE"
              exit 0
            fi
            echo "Attempt $attempt/12: v67 service-worker marker not visible yet"
            sleep 5
          done
          echo "Production did not expose $EXPECTED_CACHE within the probe window"
          exit 1

      - name: Verify production shell version
        shell: bash
        run: |
          set -euo pipefail
          index="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/")"
          sw="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/sw.js")"
          grep -q "$EXPECTED_ROUTE_MARKER" <<<"$index"
          grep -q "$EXPECTED_CACHE" <<<"$sw"
          echo "Production shell markers match v67"

      - name: Measure live endpoint latency
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local path="$1"
            curl -sS -o /tmp/entego-probe-body \
              --connect-timeout 8 --max-time 20 \
              -w "path=${path} status=%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s bytes=%{size_download}\n" \
              "$BASE_URL$path"
          }
          probe "/"
          probe "/sw.js"
          probe "/api/auth/me"
          probe "/api/directory?limit=1"

      - name: Verify public directory response
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/entego-directory.json -w '%{http_code}' --connect-timeout 8 --max-time 20 "$BASE_URL/api/directory?limit=1")"
          test "$code" = "200"
          grep -Eq '"partners"|"ok"' /tmp/entego-directory.json
          echo "Public directory endpoint responded with production JSON"
