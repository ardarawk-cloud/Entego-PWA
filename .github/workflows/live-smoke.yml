name: ENTEGO LIVE SMOKE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-production:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BASE_URL: https://entego-pwa.ardarawk.workers.dev
      EXPECTED_CACHE: entego-v73
      EXPECTED_BOOT: ENTEGO_BOOT_VERSION='73'
    steps:
      - name: Wait for complete v73 production state
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            index="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/" 2>/dev/null || true)"
            sw="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/sw.js" 2>/dev/null || true)"
            account="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/account-route-fix-flow.js?v=73" 2>/dev/null || true)"
            truth="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/production-truth-gate-flow.js?v=73" 2>/dev/null || true)"
            loader="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/route-loader-flow.js?v=73" 2>/dev/null || true)"
            if grep -q "$EXPECTED_BOOT" <<<"$index" \
              && grep -q 'Pembaruan ENTEGO siap' <<<"$index" \
              && grep -q 'Memulihkan modul ENTEGO' <<<"$index" \
              && grep -q 'ENTEGO belum selesai memuat halaman' <<<"$index" \
              && grep -q 'visibilitychange' <<<"$index" \
              && ! grep -q 'location.reload()' <<<"$index" \
              && ! grep -q 'sessionStorage' <<<"$index" \
              && grep -q "$EXPECTED_CACHE" <<<"$sw" \
              && ! grep -q 'client.navigate' <<<"$sw" \
              && grep -q 'networkFirstNavigation' <<<"$sw" \
              && grep -q 'navigationPreload' <<<"$sw" \
              && ! grep -q 'staleWhileRevalidate' <<<"$sw" \
              && grep -q 'entego-directory-v68' <<<"$sw" \
              && grep -q 'account-route-fix-flow.js?v=73' <<<"$sw" \
              && grep -q 'production-truth-gate-flow.js?v=73' <<<"$sw" \
              && grep -q 'route-loader-flow.js?v=73' <<<"$sw" \
              && grep -q "ARF_VERSION='73'" <<<"$account" \
              && grep -q 'Metode Pembayaran' <<<"$account" \
              && grep -q 'ADMIN REQUIRED' <<<"$account" \
              && grep -q 'ptgReady' <<<"$truth" \
              && grep -q 'if(!ptgReady())return false' <<<"$truth" \
              && grep -q "RL_VERSION='73'" <<<"$loader"; then
              echo "Production exposes complete ENTEGO v73 network-first blank-screen recovery state"
              exit 0
            fi
            echo "Attempt $attempt/18: production v73 assets are still converging"
            sleep 5
          done
          echo "Production did not converge to complete ENTEGO v73 within the probe window"
          exit 1

      - name: Wait for directory timing instrumentation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            headers="$(curl -sS -D - -o /dev/null --connect-timeout 8 --max-time 20 "$BASE_URL/api/directory?limit=1" 2>/dev/null || true)"
            if grep -qi '^server-timing: entego_partner_do;dur=' <<<"$headers"; then
              echo "$headers" | grep -iE '^(server-timing|x-entego-directory-do-ms):'
              exit 0
            fi
            echo "Attempt $attempt/12: directory timing header not visible yet"
            sleep 5
          done
          echo "Production did not expose ENTEGO directory timing instrumentation within the probe window"
          exit 1

      - name: Measure live endpoint latency
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local label="$1"
            local path="$2"
            curl -sS -o /tmp/entego-probe-body \
              --connect-timeout 8 --max-time 20 \
              -w "label=${label} path=${path} status=%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s bytes=%{size_download}\n" \
              "$BASE_URL$path"
          }
          probe "home-1" "/"
          probe "home-2" "/"
          probe "stale-v71-url" "/?__entego_sw=71"
          probe "recovery-v72-url" "/?recover=72"
          probe "sw" "/sw.js"
          probe "auth-1" "/api/auth/me"
          probe "auth-2" "/api/auth/me"
          probe "directory-1" "/api/directory?limit=1"
          probe "directory-2" "/api/directory?limit=1"

      - name: Verify public directory response
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/entego-directory.json -w '%{http_code}' --connect-timeout 8 --max-time 20 "$BASE_URL/api/directory?limit=1")"
          test "$code" = "200"
          grep -Eq '"partners"|"ok"' /tmp/entego-directory.json
          echo "Public directory endpoint responded with production JSON"
