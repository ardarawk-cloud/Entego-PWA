name: ENTEGO LIVE SMOKE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-production:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BASE_URL: https://entego-pwa.ardarawk.workers.dev
      EXPECTED_CACHE: entego-v76
      EXPECTED_BOOT: ENTEGO_BOOT_VERSION='76'
    steps:
      - name: Wait for complete v76 production state
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            index="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/" 2>/dev/null || true)"
            sw="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/sw.js" 2>/dev/null || true)"
            account="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/account-route-fix-flow.js?v=76" 2>/dev/null || true)"
            loader="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/route-loader-flow.js?v=76" 2>/dev/null || true)"
            auth="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/auth-flow.js?v=76" 2>/dev/null || true)"
            entry="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/assets/index.js" 2>/dev/null || true)"
            css="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/assets/index.css" 2>/dev/null || true)"
            if grep -q "$EXPECTED_BOOT" <<<"$index" \
              && grep -q "ENTEGO_ASSET_STRATEGY='static-shell-stable-v76'" <<<"$index" \
              && grep -q 'id="entegoStaticShell"' <<<"$index" \
              && grep -q 'Koneksi lambat' <<<"$index" \
              && ! grep -q 'id="entegoBootShield"' <<<"$index" \
              && ! grep -Eq '/assets/[^" ]+-[A-Za-z0-9_-]{6,}\.js' <<<"$index" \
              && ! grep -Eq '/assets/[^" ]+-[A-Za-z0-9_-]{6,}\.css' <<<"$index" \
              && grep -q "$EXPECTED_CACHE" <<<"$sw" \
              && grep -q '"/assets/index.js"' <<<"$sw" \
              && grep -q '"/assets/index.css"' <<<"$sw" \
              && grep -q 'appShellNavigation' <<<"$sw" \
              && grep -q 'event.waitUntil(refresh)' <<<"$sw" \
              && ! grep -q 'networkFirstNavigation' <<<"$sw" \
              && grep -q 'entego-directory-v68' <<<"$sw" \
              && grep -q 'account-route-fix-flow.js?v=76' <<<"$sw" \
              && grep -q 'route-loader-flow.js?v=76' <<<"$sw" \
              && grep -q "ARF_VERSION='76'" <<<"$account" \
              && grep -q "RL_VERSION='76'" <<<"$loader" \
              && grep -q "AUTH_UI_VERSION='76'" <<<"$auth" \
              && grep -q 'authRegisterStatus' <<<"$auth" \
              && grep -q 'Membuat akun' <<<"$auth" \
              && test -n "$entry" \
              && test -n "$css"; then
              echo "Production exposes ENTEGO v76 registration UX"
              exit 0
            fi
            echo "Attempt $attempt/18: production v76 assets are still converging"
            sleep 5
          done
          echo "Production did not converge to complete ENTEGO v76 within the probe window"
          exit 1

      - name: Verify registration route reaches auth Durable Object
        shell: bash
        run: |
          set -euo pipefail
          email="registration-probe-${GITHUB_RUN_ID}@example.invalid"
          code="$(curl -sS -o /tmp/register-probe.json -w '%{http_code}' --connect-timeout 8 --max-time 20 \
            -H 'content-type: application/json' -H 'accept: application/json' \
            --data "{\"displayName\":\"ENTEGO Probe\",\"email\":\"$email\",\"password\":\"ProbePass123!\",\"role\":\"probe-invalid\"}" \
            "$BASE_URL/api/auth/register")"
          cat /tmp/register-probe.json
          test "$code" = "400"
          grep -q '"error":"INVALID_ROLE"' /tmp/register-probe.json
          echo "Registration request reached production auth validation without creating a user"

      - name: Wait for directory timing instrumentation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            headers="$(curl -sS -D - -o /dev/null --connect-timeout 8 --max-time 20 "$BASE_URL/api/directory?limit=1" 2>/dev/null || true)"
            if grep -qi '^server-timing: entego_partner_do;dur=' <<<"$headers"; then
              echo "$headers" | grep -iE '^(server-timing|x-entego-directory-do-ms):'
              exit 0
            fi
            echo "Attempt $attempt/12: directory timing header not visible yet"
            sleep 5
          done
          echo "Production did not expose ENTEGO directory timing instrumentation within the probe window"
          exit 1

      - name: Measure live endpoint latency
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local label="$1"
            local path="$2"
            curl -sS -o /tmp/entego-probe-body --connect-timeout 8 --max-time 20 \
              -w "label=${label} path=${path} status=%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s bytes=%{size_download}\n" \
              "$BASE_URL$path"
          }
          probe "home-1" "/"
          probe "home-2" "/"
          probe "entry" "/assets/index.js"
          probe "css" "/assets/index.css"
          probe "sw" "/sw.js"
          probe "auth" "/api/auth/me"
          probe "directory" "/api/directory?limit=1"

      - name: Verify public directory response
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/entego-directory.json -w '%{http_code}' --connect-timeout 8 --max-time 20 "$BASE_URL/api/directory?limit=1")"
          test "$code" = "200"
          grep -Eq '"partners"|"ok"' /tmp/entego-directory.json
          echo "Public directory endpoint responded with production JSON"
