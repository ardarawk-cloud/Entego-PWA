name: ENTEGO LIVE SMOKE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://entego-pwa.ardarawk.workers.dev
      EXPECTED_CACHE: entego-v69
      EXPECTED_INDEX_MARKER: entego_sw69_takeover
    steps:
      - name: Wait for v69 service worker marker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            sw="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/sw.js" 2>/dev/null || true)"
            if grep -q "$EXPECTED_CACHE" <<<"$sw"; then
              echo "Production service worker exposes $EXPECTED_CACHE"
              exit 0
            fi
            echo "Attempt $attempt/12: v69 service-worker marker not visible yet"
            sleep 5
          done
          echo "Production did not expose $EXPECTED_CACHE within the probe window"
          exit 1

      - name: Verify production shell and boot recovery
        shell: bash
        run: |
          set -euo pipefail
          index="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/")"
          sw="$(curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/sw.js")"
          grep -q "$EXPECTED_INDEX_MARKER" <<<"$index"
          grep -q 'sanitizeHomeFallback' <<<"$index"
          grep -q 'Memulihkan tampilan ENTEGO' <<<"$index"
          grep -q 'production-truth-gate-flow.js?v=69' <<<"$index"
          grep -q "$EXPECTED_CACHE" <<<"$sw"
          grep -q 'entego-directory-v68' <<<"$sw"
          grep -q 'production-truth-gate-flow.js?v=69' <<<"$sw"
          grep -q 'route-loader-flow.js?v=69' <<<"$sw"
          grep -q 'url.pathname==="/api/directory"' <<<"$sw"
          curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/production-truth-gate-flow.js?v=69" | grep -q 'ptgReveal'
          curl -fsS --connect-timeout 8 --max-time 15 "$BASE_URL/route-loader-flow.js?v=69" | grep -q "RL_VERSION='69'"
          echo "Production exposes v69 boot recovery and critical boot modules"

      - name: Wait for directory timing instrumentation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            headers="$(curl -sS -D - -o /dev/null --connect-timeout 8 --max-time 20 "$BASE_URL/api/directory?limit=1" 2>/dev/null || true)"
            if grep -qi '^server-timing: entego_partner_do;dur=' <<<"$headers"; then
              echo "$headers" | grep -iE '^(server-timing|x-entego-directory-do-ms):'
              exit 0
            fi
            echo "Attempt $attempt/12: directory timing header not visible yet"
            sleep 5
          done
          echo "Production did not expose ENTEGO directory timing instrumentation within the probe window"
          exit 1

      - name: Measure live endpoint latency
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local label="$1"
            local path="$2"
            curl -sS -o /tmp/entego-probe-body \
              --connect-timeout 8 --max-time 20 \
              -w "label=${label} path=${path} status=%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s bytes=%{size_download}\n" \
              "$BASE_URL$path"
          }
          probe "home-1" "/"
          probe "home-2" "/"
          probe "sw" "/sw.js"
          probe "auth-1" "/api/auth/me"
          probe "auth-2" "/api/auth/me"
          probe "directory-1" "/api/directory?limit=1"
          probe "directory-2" "/api/directory?limit=1"
          echo 'Directory backend timing sample:'
          headers="$(curl -sS -D - -o /dev/null --connect-timeout 8 --max-time 20 "$BASE_URL/api/directory?limit=1" || true)"
          echo "$headers" | grep -iE '^(server-timing|x-entego-directory-do-ms):' || echo 'Timing header not returned on this sample; production marker was verified above.'

      - name: Verify public directory response
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/entego-directory.json -w '%{http_code}' --connect-timeout 8 --max-time 20 "$BASE_URL/api/directory?limit=1")"
          test "$code" = "200"
          grep -Eq '"partners"|"ok"' /tmp/entego-directory.json
          echo "Public directory endpoint responded with production JSON"
