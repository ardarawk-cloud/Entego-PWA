name: ENTEGO PLAY STORE CANDIDATE

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Play versionName'
        required: true
        default: '1.0.3'
        type: string
      version_code:
        description: 'Play versionCode (must increase for every Play upload)'
        required: true
        default: '4'
        type: string

permissions:
  contents: read

jobs:
  play-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ENTEGO_VERSION_NAME: ${{ inputs.version_name }}
      ENTEGO_VERSION_CODE: ${{ inputs.version_code }}
      ENTEGO_KEYSTORE_B64: ${{ secrets.ENTEGO_ANDROID_KEYSTORE_B64 }}
      ENTEGO_KEY_ALIAS: ${{ secrets.ENTEGO_ANDROID_KEY_ALIAS }}
      ENTEGO_STORE_PASSWORD: ${{ secrets.ENTEGO_ANDROID_STORE_PASSWORD }}
      ENTEGO_KEY_PASSWORD: ${{ secrets.ENTEGO_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Require protected Play upload key
        shell: bash
        run: |
          set -euo pipefail
          for name in ENTEGO_KEYSTORE_B64 ENTEGO_KEY_ALIAS ENTEGO_STORE_PASSWORD ENTEGO_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required. Play candidate will not be built unsigned."
              exit 1
            fi
          done
          case "$ENTEGO_VERSION_CODE" in
            ''|*[!0-9]*) echo "::error::version_code must be numeric"; exit 1 ;;
          esac
          if [ "$ENTEGO_VERSION_CODE" -lt 1 ]; then echo "::error::version_code must be >= 1"; exit 1; fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production web bundle
        run: npm run build

      - name: Verify Play compliance assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/privacy-policy.html
          test -f dist/delete-account.html
          test -f dist/play-store-compliance-flow.js
          grep -q 'play-store-compliance-flow.js' dist/index.html
          grep -q 'Penghapusan Akun' dist/delete-account.html
          grep -q 'Kebijakan Privasi' dist/privacy-policy.html

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          npx cap sync android
          npm run android:assets
          test -f android/gradlew
          grep -q 'com.ardacore.entego' android/app/build.gradle
          grep -q 'compileSdkVersion = 36' android/variables.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png

      - name: Set Play version
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import os,re
          p=Path('android/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+', f"versionCode {os.environ['ENTEGO_VERSION_CODE']}", s, count=1)
          s=re.sub(r'versionName\s+["\'][^"\']+["\']', f"versionName \"{os.environ['ENTEGO_VERSION_NAME']}\"", s, count=1)
          p.write_text(s)
          PY
          grep -q "versionCode ${ENTEGO_VERSION_CODE}" android/app/build.gradle
          grep -q "versionName \"${ENTEGO_VERSION_NAME}\"" android/app/build.gradle

      - name: Build release AAB and APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew clean bundleRelease assembleRelease --no-daemon --stacktrace
          cd ..
          test -f android/app/build/outputs/bundle/release/app-release.aab
          test -f android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Restore upload key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/entego-play-upload.jks"
          printf '%s' "$ENTEGO_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$ENTEGO_STORE_PASSWORD" -alias "$ENTEGO_KEY_ALIAS" >/dev/null
          echo "ENTEGO_UPLOAD_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Sign Play artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p play-out
          cp android/app/build/outputs/bundle/release/app-release.aab "play-out/ENTEGO-v${ENTEGO_VERSION_NAME}-${ENTEGO_VERSION_CODE}.aab"
          jarsigner \
            -keystore "$ENTEGO_UPLOAD_KEYSTORE" \
            -storepass "$ENTEGO_STORE_PASSWORD" \
            -keypass "$ENTEGO_KEY_PASSWORD" \
            "play-out/ENTEGO-v${ENTEGO_VERSION_NAME}-${ENTEGO_VERSION_CODE}.aab" \
            "$ENTEGO_KEY_ALIAS"
          jarsigner -verify -strict -verbose -certs "play-out/ENTEGO-v${ENTEGO_VERSION_NAME}-${ENTEGO_VERSION_CODE}.aab" >/dev/null

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$ENTEGO_UPLOAD_KEYSTORE" \
            --ks-key-alias "$ENTEGO_KEY_ALIAS" \
            --ks-pass "pass:$ENTEGO_STORE_PASSWORD" \
            --key-pass "pass:$ENTEGO_KEY_PASSWORD" \
            --out "play-out/ENTEGO-v${ENTEGO_VERSION_NAME}-${ENTEGO_VERSION_CODE}.apk" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "play-out/ENTEGO-v${ENTEGO_VERSION_NAME}-${ENTEGO_VERSION_CODE}.apk" > play-out/signing-certificate.txt

      - name: Verify package identity
        shell: bash
        run: |
          set -euo pipefail
          APK="play-out/ENTEGO-v${ENTEGO_VERSION_NAME}-${ENTEGO_VERSION_CODE}.apk"
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n1)
          echo "$BADGING" | tee play-out/package-identity.txt
          echo "$BADGING" | grep -q "name='com.ardacore.entego'"
          echo "$BADGING" | grep -q "versionCode='${ENTEGO_VERSION_CODE}'"
          echo "$BADGING" | grep -q "versionName='${ENTEGO_VERSION_NAME}'"
          grep -R -q 'targetSdkVersion = 36' android/variables.gradle

      - name: Record Play candidate metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'ENTEGO PLAY STORE CANDIDATE'
            echo "versionName=${ENTEGO_VERSION_NAME}"
            echo "versionCode=${ENTEGO_VERSION_CODE}"
            echo 'applicationId=com.ardacore.entego'
            echo 'targetSdk=36'
            echo "commit=${GITHUB_SHA}"
            echo 'artifact=aab'
            echo 'signing=protected-upload-key'
            echo 'privacyPolicy=/privacy-policy.html'
            echo 'accountDeletion=/delete-account.html'
          } > play-out/PLAY-CANDIDATE.txt
          sha256sum play-out/*.aab play-out/*.apk > play-out/SHA256SUMS.txt

      - name: Remove upload key from runner
        if: always()
        shell: bash
        run: rm -f "${ENTEGO_UPLOAD_KEYSTORE:-$RUNNER_TEMP/entego-play-upload.jks}"

      - name: Upload signed Play candidate
        uses: actions/upload-artifact@v4
        with:
          name: ENTEGO-Play-v${{ inputs.version_name }}-${{ inputs.version_code }}
          path: play-out/
          if-no-files-found: error
          retention-days: 30
