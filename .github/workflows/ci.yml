name: ENTEGO CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build PWA
        run: npm run build

      - name: Verify critical PWA assets
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/trust-flow.js
          test -f dist/trust-center-flow.js
          test -f dist/participants-flow.js
          test -f dist/readiness-flow.js
          test -f dist/action-center-flow.js
          test -f dist/privacy-center-flow.js
          test -f dist/production-truth-gate-flow.js
          test -f dist/server-chat-flow.js
          test -f dist/security-sessions-flow.js
          test -f dist/admin-route-integrity-flow.js
          test -f dist/portfolio-media-flow.js
          grep -q "auth-store-v2.js" api-worker-v50.js
          grep -q '"main":"./api-worker-v59.js"' wrangler.jsonc
          grep -q '"ENT_PRESENCE"' wrangler.jsonc
          grep -q '"ENT_ALERTS"' wrangler.jsonc
          grep -q "action-center-flow.js?v=59" index.html
          grep -q "privacy-center-flow.js?v=59" index.html
          grep -q "production-truth-gate-flow.js?v=59" index.html
          grep -q 'id="entegoBootShield"' index.html
          grep -q 'id="app" style="visibility:hidden"' index.html
          grep -q "function ptgReveal" production-truth-gate-flow.js
          grep -q "'notifications'" action-center-flow.js
          grep -q "notificationCenter:'action-center-full-route'" api-worker-v59.js
          grep -q "productionTruth:'fail-closed'" api-worker-v57.js
          grep -q "eventTimeGuard:'wita-future-only'" api-worker-v58.js
          grep -q "service_start_event_date_only" payment-state-guard-flow.js
          grep -q "category:'payment_refund'" payment-state-guard-flow.js
          ! grep -q "cancel-flow.js" index.html
          ! grep -q "promo=150000" market-booking-flow.js
          ! grep -q "promo=150000" partner-offer-flow.js
          ! grep -q "2026-08-15.*booked" partner-offer-flow.js
          ! grep -q "createOrderFromDraft" market-booking-flow.js
          ! grep -q "DJ Raka Bali" market-booking-flow.js

      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@latest deploy --dry-run
