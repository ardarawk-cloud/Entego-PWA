name: ENTEGO CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build PWA
        run: npm run build

      - name: Verify critical PWA assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/assets/index.js
          test -f dist/assets/index.css
          test -f dist/event-ecosystem-flow.js
          test -f dist/service-menu-flow.js
          test -f dist/partner-category-flow.js
          test -f dist/account-route-fix-flow.js
          test -f dist/route-loader-flow.js
          test -f dist/production-truth-gate-flow.js
          test -f dist/production-guard-flow.js
          test -f dist/premium-ui-flow.js
          test -f dist/auth-flow.js
          test -f dist/action-center-flow.js
          test -f dist/server-partner-flow.js
          test -f dist/server-booking-flow.js
          test -f dist/payment-flow.js
          test -f dist/admin-payment-flow.js
          test -f dist/admin-verification-flow.js
          test -f dist/identity-center-flow.js
          test -f dist/identity-submit-hotfix-flow.js
          test -f dist/support-center-flow.js
          test -f vite.config.js
          test -f identity-api.js
          test -f partner-api.js
          test -f scripts/ensure-private-r2.mjs

          grep -q "node scripts/ensure-private-r2.mjs" package.json
          grep -q "WORKERS_CI!=='1'" scripts/ensure-private-r2.mjs
          grep -q "entego-identity-private" scripts/ensure-private-r2.mjs
          grep -q "entryFileNames: 'assets/\[name\].js'" vite.config.js
          grep -q "chunkFileNames: 'assets/\[name\].js'" vite.config.js
          grep -q "assetFileNames: 'assets/\[name\]\[extname\]'" vite.config.js
          grep -q "entego-core-catalog-v2" vite.config.js
          ! grep -Eq '/assets/[^" ]+-[A-Za-z0-9_-]{6,}\.js' dist/index.html
          ! grep -Eq '/assets/[^" ]+-[A-Za-z0-9_-]{6,}\.css' dist/index.html

          python3 <<'PY'
          from pathlib import Path
          bundle=Path('dist/assets/index.js').read_text()
          required=[
              'ENTEGO PROFESSIONAL PARTNER',
              'Event Organizer',
              'Wedding Organizer',
              'Party Planner',
              'Corporate Event Planner',
              'Venue Lainnya',
              'Cari DJ, EO, WO, venue, sound...',
              'Event Ecosystem Platform',
              'Menu Layanan & Harga',
          ]
          missing=[x for x in required if x not in bundle]
          if missing:
              raise SystemExit(f'Compiled core catalog missing: {missing}')
          if 'price:900000' in bundle:
              raise SystemExit('Legacy Rp900k mock price remains in compiled bundle')
          print('Compiled Event Ecosystem core catalog verified')
          PY

          grep -q '"main":"./api-worker-v63.js"' wrangler.jsonc
          grep -q '"ENT_SUPPORT","class_name":"EntegoSupport"' wrangler.jsonc
          grep -q '"binding":"ENT_IDENTITY_MEDIA"' wrangler.jsonc
          grep -q '"bucket_name":"entego-identity-private"' wrangler.jsonc
          grep -q 'identity-center-flow.js' route-loader-flow.js
          grep -q 'event-ecosystem-flow.js' route-loader-flow.js
          grep -q 'service-menu-flow.js' route-loader-flow.js
          grep -q '@vite-ignore' route-loader-flow.js
          grep -q 'rlIdle' route-loader-flow.js

          grep -q "ENTEGO_BOOT_VERSION='84'" index.html
          grep -q "ENTEGO_ASSET_STRATEGY='core-catalog-compiled-v84'" index.html
          grep -q 'event-ecosystem-flow.js?v=84' index.html
          grep -q 'route-loader-flow.js?v=84' index.html
          grep -q 'id="entegoStaticShell"' index.html
          grep -q 'Event Ecosystem Platform' index.html
          grep -q 'Cari DJ, EO, WO, venue' index.html
          grep -q "updateViaCache:'none'" index.html
          grep -q 'visibilitychange' index.html
          ! grep -q 'visibility:hidden' index.html

          grep -q 'const CACHE="entego-v84"' sw.js
          grep -q 'const DIRECTORY_CACHE="entego-directory-v68"' sw.js
          grep -q '"/assets/index.js"' sw.js
          grep -q 'event-ecosystem-flow.js?v=84' sw.js
          grep -q 'route-loader-flow.js?v=84' sw.js
          grep -q 'appShellNavigation' sw.js
          grep -q 'cacheFirst' sw.js

          grep -Fq "ENTEGO_EVENT_ECOSYSTEM_VERSION='2.0'" event-ecosystem-flow.js
          grep -Fq "ENTEGO_SERVICE_MENU_VERSION='1.1'" service-menu-flow.js
          grep -Fq "ENTEGO_MIN_SERVICE_PRICE=1000000" service-menu-flow.js
          grep -Fq "MIN_SERVICE_PRICE=1000000" partner-api.js
          grep -Fq 'Event Organizer' partner-category-flow.js
          grep -Fq 'Wedding Organizer' partner-category-flow.js

          grep -Fq "if(document.querySelector('#entegoIdentityCenter'))return;" identity-center-flow.js
          grep -q 'KTP — WNI' identity-center-flow.js
          grep -q 'Paspor — WNA / internasional' identity-center-flow.js
          grep -Fq "IDENTITY_SUBMIT_HOTFIX_VERSION='78'" identity-submit-hotfix-flow.js
          grep -q 'identity_verifications' partner-store-v2.js
          grep -q 'identity_events' partner-store-v2.js
          grep -Fq "ID_TYPES=new Set(['KTP','SIM','PASSPORT'])" partner-store-v2.js
          grep -q 'FULL_ID_NUMBER_NOT_ACCEPTED' partner-store-v2.js
          grep -q 'FULL_BANK_NUMBER_NOT_ACCEPTED' partner-store-v2.js
          grep -q 'ENT_IDENTITY_MEDIA' identity-api.js
          grep -Fq "IDENTITY_TYPES=['KTP','SIM','PASSPORT']" identity-api.js
          grep -q 'documentsPublic:false' identity-api.js
          grep -q 'fullNikStored:false' identity-api.js
          grep -q 'fullBankAccountStored:false' identity-api.js
          grep -q 'handleIdentityApi' api-worker-v63.js
          ! grep -q 'ENT_IDENTITY_MEDIA' media-api.js
          ! grep -q 'identity/' media-api.js

          grep -Fq "import './premium-ui-flow.js'" production-guard-flow.js
          grep -q 'entegoPremiumMonoStyle' premium-ui-flow.js
          grep -q 'entego-brand-mark' premium-ui-flow.js
          ! grep -q "import './server-chat-flow.js'" production-guard-flow.js
          ! grep -q "import './admin-verification-flow.js'" production-guard-flow.js
          ! grep -q "cancel-flow.js" index.html
          ! grep -q "promo=150000" market-booking-flow.js
          ! grep -q "createOrderFromDraft" market-booking-flow.js

      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@latest deploy --dry-run
