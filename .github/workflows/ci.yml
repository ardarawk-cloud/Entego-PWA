name: ENTEGO CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build PWA
        run: npm run build

      - name: Verify critical PWA assets
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/trust-flow.js
          test -f dist/trust-center-flow.js
          test -f dist/participants-flow.js
          test -f dist/readiness-flow.js
          test -f dist/action-center-flow.js
          test -f dist/server-chat-flow.js
          test -f dist/security-sessions-flow.js
          test -f dist/admin-route-integrity-flow.js
          test -f dist/portfolio-media-flow.js
          grep -q "auth-store-v2.js" api-worker-v50.js
          grep -q '"main":"./api-worker-v55.js"' wrangler.jsonc
          grep -q '"ENT_PRESENCE"' wrangler.jsonc
          grep -q '"ENT_ALERTS"' wrangler.jsonc
          grep -q "action-center-flow.js?v=55" index.html
          ! grep -q "cancel-flow.js" index.html

      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@latest deploy --dry-run
