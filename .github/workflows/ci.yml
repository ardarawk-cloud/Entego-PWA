name: ENTEGO CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build PWA
        run: npm run build

      - name: Verify critical PWA assets
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/trust-flow.js
          test -f dist/trust-center-flow.js
          test -f dist/participants-flow.js
          test -f dist/readiness-flow.js
          test -f dist/action-center-flow.js
          test -f dist/privacy-center-flow.js
          test -f dist/support-center-flow.js
          test -f dist/admin-account-control-flow.js
          test -f dist/production-truth-gate-flow.js
          test -f dist/server-chat-flow.js
          test -f dist/security-sessions-flow.js
          test -f dist/admin-route-integrity-flow.js
          test -f dist/portfolio-media-flow.js
          grep -q "auth-store-v3.js" api-worker-v60.js
          grep -q '"main":"./api-worker-v63.js"' wrangler.jsonc
          grep -q '"ENT_SUPPORT","class_name":"EntegoSupport"' wrangler.jsonc
          grep -q '"EntegoSupport":{"type":"durable-object","storage":"sqlite"}' wrangler.jsonc
          grep -q "support_cases" support-store.js
          grep -q "account_closure" api-worker-v63.js
          grep -q "account_closure_blocked" api-worker-v63.js
          grep -q "augmentActionCenter" api-worker-v63.js
          grep -q "support-center-flow.js?v=63" index.html
          grep -q "OFFICIAL CASE CENTER" support-center-flow.js
          grep -q "PLATFORM CASE CONTROL" support-center-flow.js
          grep -q "selectedTalentCache:'isolated-from-partner-self'" api-worker-v61.js
          grep -q "cancellationFairness:'reason-required-audited'" api-worker-v62.js
          grep -q "psgReasonDialog" payment-state-guard-flow.js
          grep -q "entego_selected_partner_profile" server-partner-flow.js
          grep -q "entego_selected_partner_packages" server-booking-flow.js
          grep -q 'id="entegoBootShield"' index.html
          ! grep -q "const mbProfile=()=>mbRead('entego_partner_profile'" market-booking-flow.js
          ! grep -q "biRead('entego_partner_packages'" booking-integrity-flow.js
          ! grep -q "packages=sbRead('entego_partner_packages'" server-booking-flow.js
          ! grep -q "profile=ptgRead('entego_partner_profile'" production-truth-gate-flow.js
          ! grep -q "cancel-flow.js" index.html
          ! grep -q "promo=150000" market-booking-flow.js
          ! grep -q "createOrderFromDraft" market-booking-flow.js

      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@latest deploy --dry-run
