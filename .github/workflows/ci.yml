name: ENTEGO CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build PWA
        run: npm run build

      - name: Verify current production assets
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          required=[
            'index.html','dist/index.html','dist/sw.js','dist/assets/index-v87.js','dist/assets/index-v87.css',
            'dist/logo-header.png','dist/event-ecosystem-flow.js','dist/service-menu-flow.js',
            'dist/partner-category-flow.js','dist/logout-hotfix-flow.js','dist/home-copy-flow.js','dist/account-role-ux-flow.js','dist/route-loader-flow.js',
            'dist/auth-flow.js','dist/identity-center-flow.js','dist/identity-submit-hotfix-flow.js',
            'partner-api.js','partner-store-v2.js','partner-store-v3.js','identity-api.js','api-worker-v63.js',
            'wrangler.jsonc','scripts/ensure-private-r2.mjs','package.json','media-api.js','market-booking-flow.js'
          ]
          missing=[p for p in required if not Path(p).is_file()]
          if missing: raise SystemExit(f'Missing required files: {missing}')
          checks={
            'dist/assets/index-v87.js':['globalThis.ENTEGO_HOME_VERSION="1.0.9"','Jelajahi Kategori','Layanan Populer','MUA','Event Organizer','Wedding Organizer','/logo-header.png?v=87'],
            'dist/home-copy-flow.js':["ENTEGO_HOME_COPY_VERSION='1.0'",'Semua Kebutuhan Event, Satu Aplikasi','titleCaseCategory','clamp(24px,7vw,28px)'],
            'dist/account-role-ux-flow.js':["ENTEGO_ACCOUNT_ROLE_UX_VERSION='1.0'",'MENU AKUN','Riwayat Transaksi','Metode Pembayaran','Alamat Tersimpan','Voucher & Promo','ENTEGO Wallet','customerIdentityApproved','ID Verified','Dashboard Mitra','Admin Control Center'],
            'dist/route-loader-flow.js':["RL_VERSION='90'",'home-copy-flow.js','account-role-ux-flow.js','logout-hotfix-flow.js','auth-flow.js','partner-category-flow.js','identity-submit-hotfix-flow.js'],
            'index.html':['/sw.js?v=90','/home-copy-flow.js?v=90','/route-loader-flow.js?v=90','/logo-header.png?v=87','Semua Kebutuhan Event, Satu Aplikasi'],
            'dist/index.html':["ENTEGO_BOOT_VERSION='90'",'/sw.js?v=90','/logo-header.png?v=87','Semua Kebutuhan Event, Satu Aplikasi'],
            'dist/sw.js':['const CACHE="entego-v90"','const DIRECTORY_CACHE="entego-directory-v90"','/route-loader-flow.js?v=90','/home-copy-flow.js?v=90','/account-role-ux-flow.js?v=90'],
            'dist/logout-hotfix-flow.js':["ENTEGO_LOGOUT_HOTFIX_VERSION='1.1'",'entego_force_logged_out','entegoLogout','authLoginBtn','authRegisterBtn','location.replace'],
            'dist/partner-category-flow.js':["ENTEGO_PARTNER_CATEGORY_VERSION='2.1'",'grid-template-columns:20px minmax(0,1fr)','min-height:48px','entego_partner_services'],
            'dist/identity-submit-hotfix-flow.js':["IDENTITY_SUBMIT_HOTFIX_VERSION='79'",'Masukkan 4 digit terakhir','sessionStorage'],
            'dist/service-menu-flow.js':["ENTEGO_SERVICE_MENU_VERSION='1.1'",'ENTEGO_MIN_SERVICE_PRICE=1000000'],
            'partner-api.js':['MIN_SERVICE_PRICE=1000000'],
            'partner-store-v3.js':['services_json'],
            'identity-api.js':["IDENTITY_TYPES=['KTP','SIM','PASSPORT']",'ENT_IDENTITY_MEDIA'],
            'wrangler.jsonc':['"main":"./api-worker-v63.js"','"binding":"ENT_IDENTITY_MEDIA"'],
            'package.json':['node scripts/ensure-private-r2.mjs']
          }
          failures=[]
          for file,markers in checks.items():
            text=Path(file).read_text(errors='ignore')
            for marker in markers:
              if marker not in text: failures.append(f'{file}: {marker}')
          bundle=Path('dist/assets/index-v87.js').read_text(errors='ignore')
          for forbidden in ['price:900000','["Entertainment",["DJ","MC","Live Band","Singer"]]']:
            if forbidden in bundle: failures.append(f'legacy marker remains: {forbidden}')
          for file,forbidden in [('media-api.js','ENT_IDENTITY_MEDIA'),('media-api.js','identity/'),('market-booking-flow.js','promo=150000'),('market-booking-flow.js','createOrderFromDraft')]:
            if forbidden in Path(file).read_text(errors='ignore'): failures.append(f'forbidden marker {file}: {forbidden}')
          if failures:
            print('ENTEGO CI FAILURES:')
            for x in failures: print(' -',x)
            raise SystemExit(1)
          print('VERIFIED: current ENTEGO production gates + account role UX + home copy v90')
          PY

      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@latest deploy --dry-run
