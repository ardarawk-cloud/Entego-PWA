name: ENTEGO ANDROID AUTH HAPPY PATH ONCE

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android-auth-happy-path:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://entego-pwa.ardarawk.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install browser harness
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund playwright-core
          if command -v google-chrome >/dev/null 2>&1; then echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"; \
          elif command -v google-chrome-stable >/dev/null 2>&1; then echo "CHROME=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"; \
          elif command -v chromium >/dev/null 2>&1; then echo "CHROME=$(command -v chromium)" >> "$GITHUB_ENV"; \
          else echo 'No system Chrome found'; exit 1; fi

      - name: Customer and Mitra registration through Android v76 UI
        shell: bash
        run: |
          set -euo pipefail
          sleep 12
          timeout 150s node <<'NODE'
          const { chromium } = require('playwright-core');
          const base=process.env.BASE_URL;
          const run=process.env.GITHUB_RUN_ID;
          const device={viewport:{width:412,height:915},isMobile:true,hasTouch:true,deviceScaleFactor:2.625,userAgent:'Mozilla/5.0 (Linux; Android 14; Infinix X6739) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Mobile Safari/537.36'};

          async function cleanup(){
            const r=await fetch(base+'/api/auth/__probe-cleanup',{method:'POST',headers:{accept:'application/json'}});
            const text=await r.text();
            console.log(`PROBE_CLEANUP_HTTP=${r.status} ${text}`);
            if(!r.ok)throw new Error(`cleanup failed: ${r.status}`);
          }

          async function register(browser,role){
            const email=`entego-android-${role}-${run}@example.invalid`;
            const context=await browser.newContext(device);
            const page=await context.newPage();
            page.on('pageerror',e=>console.log(`[${role} pageerror] ${e.message}`));
            try{
              await page.goto(base+'/',{waitUntil:'domcontentloaded',timeout:15000});
              await page.evaluate(()=>localStorage.setItem('entego_route','profile'));
              await page.reload({waitUntil:'domcontentloaded',timeout:15000});
              await page.waitForSelector('#authRegisterTab',{timeout:10000});
              await page.locator('#authRegisterTab').click();
              await page.locator('#authDisplayName').fill('ENTEGO Android Probe');
              await page.locator('#authRegisterEmail').fill(email);
              await page.locator('#authRegisterPassword').fill('ProbePass123!');
              await page.locator('#authRegisterRole').selectOption(role);
              await page.locator('#authRegisterBtn').click();
              await page.waitForFunction(expected=>{
                try{return JSON.parse(localStorage.getItem('entego_auth_user')||'null')?.email===expected}catch{return false}
              },email,{timeout:20000});
              const local=await page.evaluate(()=>JSON.parse(localStorage.getItem('entego_auth_user')||'null'));
              if(local?.role!==role)throw new Error(`${role} local role mismatch: ${JSON.stringify(local)}`);
              const me=await page.evaluate(async()=>{const r=await fetch('/api/auth/me',{cache:'no-store',headers:{accept:'application/json'}});return {status:r.status,data:await r.json().catch(()=>({}))}});
              if(me.status!==200||!me.data?.ok||me.data?.user?.email!==email||me.data?.user?.role!==role)throw new Error(`${role} /me mismatch: ${JSON.stringify(me)}`);
              console.log(`${role.toUpperCase()}_ANDROID_REGISTER=PASS ${email}`);
              await page.evaluate(()=>fetch('/api/auth/logout',{method:'POST',headers:{accept:'application/json'}}));
            } finally {
              await context.close();
            }
          }

          (async()=>{
            let browser;
            try{
              await cleanup();
              browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
              await register(browser,'customer');
              await register(browser,'partner');
              console.log('ANDROID_CUSTOMER_PARTNER_AUTH=PASS');
            } finally {
              if(browser)await browser.close().catch(()=>{});
              await cleanup();
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
