name: ENTEGO ANDROID APK

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'identity-api.js'
      - 'partner-store-v2.js'
      - 'identity-center-flow.js'
      - 'admin-verification-flow.js'
      - 'production-guard-flow.js'
      - 'premium-ui-flow.js'
      - 'native-runtime-flow.js'
      - 'native-identity-camera-flow.js'
      - 'resources/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENTEGO_ANDROID_VERSION: '1.0.2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install web and Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Build ENTEGO web bundle
        run: npm run build

      - name: Verify premium KYC bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/identity-center-flow.js
          test -f dist/premium-ui-flow.js
          test -f dist/native-runtime-flow.js
          test -f dist/native-identity-camera-flow.js
          grep -Fq "if(document.querySelector('#entegoIdentityCenter'))return;" dist/identity-center-flow.js
          grep -Fq "IDENTITY_UI_VERSION='77'" dist/identity-center-flow.js
          grep -Fq 'KTP — WNI' dist/identity-center-flow.js
          grep -Fq 'Paspor — WNA / internasional' dist/identity-center-flow.js
          grep -Fq "import './premium-ui-flow.js'" dist/production-guard-flow.js
          grep -Fq 'entegoPremiumMonoStyle' dist/premium-ui-flow.js
          grep -Fq "IDENTITY_TYPES=['KTP','SIM','PASSPORT']" identity-api.js
          grep -Fq "ID_TYPES=new Set(['KTP','SIM','PASSPORT'])" partner-store-v2.js
          python3 <<'PY'
          from pathlib import Path
          p=Path('dist/index.html')
          s=p.read_text()
          marker='</head>'
          bridge='  <script src="/native-runtime-flow.js?v=2"></script>\n  <script src="/native-identity-camera-flow.js?v=2"></script>\n'+marker
          if marker not in s:
              raise SystemExit('head marker missing from native bundle')
          if 'native-runtime-flow.js?v=2' not in s:
              s=s.replace(marker,bridge,1)
          p.write_text(s)
          PY
          grep -q 'native-runtime-flow.js?v=2' dist/index.html
          grep -q 'native-identity-camera-flow.js?v=2' dist/index.html
          grep -q 'assets/index.js' dist/index.html
          grep -q "https://entego-pwa.ardarawk.workers.dev" dist/native-runtime-flow.js
          grep -q 'captureIdentity' dist/native-runtime-flow.js
          grep -q 'CapacitorHttp' capacitor.config.json
          grep -q 'CapacitorCookies' capacitor.config.json
          ! grep -q '"url"' capacitor.config.json

      - name: Generate branded Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          npx cap sync android
          npm run android:assets
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'com.ardacore.entego' android/app/build.gradle
          grep -R -q 'capacitor-camera' android
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png

      - name: Set Android version
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+', 'versionCode 3', s, count=1)
          s=re.sub(r'versionName\s+["\'][^"\']+["\']', 'versionName "1.0.2"', s, count=1)
          p.write_text(s)
          PY
          grep -q 'versionCode 3' android/app/build.gradle
          grep -q 'versionName "1.0.2"' android/app/build.gradle

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ENTEGO-Android-v1.0.2-premium-kyc.apk
          sha256sum ENTEGO-Android-v1.0.2-premium-kyc.apk | tee ENTEGO-Android-v1.0.2-premium-kyc.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ENTEGO-Android-v1.0.2-premium-kyc
          path: |
            ENTEGO-Android-v1.0.2-premium-kyc.apk
            ENTEGO-Android-v1.0.2-premium-kyc.sha256
          if-no-files-found: error
          retention-days: 14
