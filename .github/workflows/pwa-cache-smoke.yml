name: ENTEGO PWA CACHE SMOKE

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pwa-cache-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BASE_URL: https://entego-pwa.ardarawk.workers.dev
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install browser driver
        run: npm install --no-save --no-audit --no-fund playwright-core

      - name: Verify controlled directory cache
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const candidates = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium-browser','/usr/bin/chromium'];
          const executablePath = candidates.find(p => fs.existsSync(p));
          if (!executablePath) throw new Error('browser_not_found');
          const browser = await chromium.launch({ executablePath, headless: true, args: ['--no-sandbox'] });
          const context = await browser.newContext();
          const page = await context.newPage();
          await page.goto(process.env.BASE_URL, { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.waitForFunction(() => navigator.serviceWorker && navigator.serviceWorker.controller, null, { timeout: 30000 });
          await page.evaluate(async () => { const reg = await navigator.serviceWorker.ready; await reg.update(); });
          await page.waitForTimeout(1200);
          if (!(await page.evaluate(() => navigator.serviceWorker.controller?.scriptURL.endsWith('/sw.js')))) {
            await page.reload({ waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => navigator.serviceWorker.controller, null, { timeout: 30000 });
          }
          const result = await page.evaluate(async () => {
            const path = '/api/directory?limit=1&cacheSmoke=v68';
            await caches.delete('entego-directory-v68');
            const timed = async () => {
              const start = performance.now();
              const response = await fetch(path);
              await response.text();
              return { ms: Math.round((performance.now() - start) * 10) / 10, status: response.status };
            };
            const first = await timed();
            const keysAfterFirst = await caches.keys();
            const second = await timed();
            const cache = await caches.open('entego-directory-v68');
            const hit = await cache.match(path);
            return { first, second, keysAfterFirst, cached: Boolean(hit), controller: navigator.serviceWorker.controller?.scriptURL || '' };
          });
          console.log(JSON.stringify(result, null, 2));
          if (result.first.status !== 200 || result.second.status !== 200) throw new Error('directory_status_failed');
          if (!result.cached || !result.keysAfterFirst.includes('entego-directory-v68')) throw new Error('directory_cache_missing');
          if (result.second.ms > 120) throw new Error(`directory_cache_second_fetch_too_slow:${result.second.ms}ms`);
          await browser.close();
          NODE
