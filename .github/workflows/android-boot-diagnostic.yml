name: ENTEGO ANDROID BOOT DIAGNOSTIC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BASE_URL: https://entego-pwa.ardarawk.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install browser harness
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund playwright-core
          if command -v google-chrome >/dev/null 2>&1; then echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV";           elif command -v google-chrome-stable >/dev/null 2>&1; then echo "CHROME=$(command -v google-chrome-stable)" >> "$GITHUB_ENV";           elif command -v chromium >/dev/null 2>&1; then echo "CHROME=$(command -v chromium)" >> "$GITHUB_ENV";           else echo 'No system Chrome found'; exit 1; fi

      - name: Probe current Android-sized web runtime
        shell: bash
        run: |
          timeout 120s node <<'NODE'
          const { chromium } = require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
            const context=await browser.newContext({
              viewport:{width:412,height:915},isMobile:true,hasTouch:true,deviceScaleFactor:2.625,
              userAgent:'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/154 Mobile Safari/537.36'
            });
            const page=await context.newPage();
            await page.goto(process.env.BASE_URL+'/',{waitUntil:'domcontentloaded',timeout:15000});
            await page.waitForTimeout(3000);
            const first=await page.evaluate(async()=>({
              staticShell:!!document.querySelector('#entegoStaticShell'),
              mainCount:document.querySelectorAll('main.content').length,
              caches:'caches'in window?await caches.keys():[],
              text:(document.body.innerText||'').slice(0,500)
            }));
            console.log('HOME',first);
            if(first.mainCount<1||!first.caches.includes('entego-v92'))process.exit(2);

            const resources=await page.evaluate(async()=>{
              const paths=['/privacy.html','/account-removal.html','/legal.html','/api/health','/api/identity/config'];
              const out={};
              for(const p of paths){const r=await fetch(p,{cache:'no-store'});out[p]={status:r.status,text:await r.text()}}
              return out;
            });
            if(resources['/privacy.html'].status!==200||!resources['/privacy.html'].text.includes('PT NADMO STUDIO INDONESIA'))process.exit(3);
            if(resources['/account-removal.html'].status!==200||!resources['/account-removal.html'].text.includes('Penghapusan Akun ENTEGO'))process.exit(4);
            if(resources['/legal.html'].status!==200||!resources['/legal.html'].text.includes('AHU-A126270.AH.01.30.Tahun 2026'))process.exit(5);
            if(resources['/api/health'].status!==200||!resources['/api/health'].text.includes('admin-reviewed-delete-anonymize-v2'))process.exit(6);
            const identity=JSON.parse(resources['/api/identity/config'].text||'{}');
            if(identity.privateDocumentStorageConfigured!==true||identity.documentsPublic!==false||identity.payoutGate!=='identity-approved-required')process.exit(7);

            await page.evaluate(()=>localStorage.setItem('entego_route','profile'));
            await page.reload({waitUntil:'domcontentloaded',timeout:15000});
            await page.waitForTimeout(2500);
            if(await page.locator('#authRegisterTab').count()!==1)process.exit(8);
            const body=(await page.locator('body').innerText());
            if(!body.includes('PT NADMO STUDIO INDONESIA')||!body.includes('Privasi'))process.exit(9);
            console.log('ANDROID_WEB_RUNTIME_V92=PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
