name: ENTEGO ANDROID BOOT DIAGNOSTIC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      BASE_URL: https://entego-pwa.ardarawk.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install browser harness
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund playwright-core
          if command -v google-chrome >/dev/null 2>&1; then echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"; \
          elif command -v google-chrome-stable >/dev/null 2>&1; then echo "CHROME=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"; \
          elif command -v chromium >/dev/null 2>&1; then echo "CHROME=$(command -v chromium)" >> "$GITHUB_ENV"; \
          else echo 'No system Chrome found'; exit 1; fi

      - name: Probe first and second Android-like launch
        shell: bash
        run: |
          timeout 50s node <<'NODE'
          const { chromium } = require('playwright-core');
          (async()=>{
            const browser = await chromium.launch({headless:true, executablePath:process.env.CHROME, args:['--no-sandbox']});
            const context = await browser.newContext({
              viewport:{width:412,height:915},
              isMobile:true,
              hasTouch:true,
              deviceScaleFactor:2.625,
              userAgent:'Mozilla/5.0 (Linux; Android 14; Infinix X6739) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Mobile Safari/537.36'
            });

            async function launch(label){
              const page = await context.newPage();
              page.on('console',m=>console.log(`[${label} console ${m.type()}] ${m.text()}`));
              page.on('pageerror',e=>console.log(`[${label} pageerror] ${e.message}`));
              page.on('requestfailed',r=>console.log(`[${label} requestfailed] ${r.url()} :: ${r.failure()?.errorText}`));
              page.on('framenavigated',f=>{if(f===page.mainFrame())console.log(`[${label} navigated] ${f.url()}`)});
              const started=Date.now();
              await page.goto(process.env.BASE_URL+'/',{waitUntil:'domcontentloaded',timeout:12000}).catch(e=>console.log(`[${label} goto interrupted] ${e.message}`));
              console.log(`[${label}] initial navigation phase ${Date.now()-started}ms`);
              await page.waitForTimeout(2200);
              const state=await page.evaluate(async()=>({
                href:location.href,
                shield:!!document.querySelector('#entegoBootShield'),
                bootText:document.querySelector('#entegoBootText')?.textContent||'',
                appVisibility:document.querySelector('#app')?getComputedStyle(document.querySelector('#app')).visibility:'missing',
                appChildren:document.querySelector('#app')?.childElementCount||0,
                mainCount:document.querySelectorAll('main.content').length,
                route:localStorage.getItem('entego_route'),
                controller:navigator.serviceWorker?.controller?.scriptURL||'',
                caches:('caches'in window)?await caches.keys():[]
              }));
              console.log(`[${label} settled] ${JSON.stringify(state)}`);
              await page.close();
              return state;
            }

            const first=await launch('first');
            await new Promise(r=>setTimeout(r,500));
            const second=await launch('second');
            console.log('FIRST_FINAL='+JSON.stringify(first));
            console.log('SECOND_FINAL='+JSON.stringify(second));
            await browser.close();
            if(second.shield) process.exit(2);
            if(second.mainCount<1) process.exit(3);
            if(!second.caches.includes('entego-v71')) process.exit(4);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
