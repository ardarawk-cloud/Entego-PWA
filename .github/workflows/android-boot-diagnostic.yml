name: ENTEGO ANDROID BOOT DIAGNOSTIC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://entego-pwa.ardarawk.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install browser harness
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund playwright-core
          if command -v google-chrome >/dev/null 2>&1; then echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"; \
          elif command -v google-chrome-stable >/dev/null 2>&1; then echo "CHROME=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"; \
          elif command -v chromium >/dev/null 2>&1; then echo "CHROME=$(command -v chromium)" >> "$GITHUB_ENV"; \
          else echo 'No system Chrome found'; exit 1; fi

      - name: Probe Android v76 static shell account routes and registration feedback
        shell: bash
        run: |
          timeout 90s node <<'NODE'
          const { chromium } = require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
            const device={viewport:{width:412,height:915},isMobile:true,hasTouch:true,deviceScaleFactor:2.625,userAgent:'Mozilla/5.0 (Linux; Android 14; Infinix X6739) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Mobile Safari/537.36'};
            const context=await browser.newContext(device);
            const snapshot=page=>page.evaluate(async()=>({
              staticShell:!!document.querySelector('#entegoStaticShell'),
              shield:!!document.querySelector('#entegoBootShield'),
              mainCount:document.querySelectorAll('main.content').length,
              route:localStorage.getItem('entego_route'),
              caches:('caches'in window)?await caches.keys():[],
              text:(document.body.innerText||'').slice(0,300)
            }));
            async function open(label,url='/'){
              const page=await context.newPage();
              page.on('pageerror',e=>console.log(`[${label} pageerror] ${e.message}`));
              await page.goto(process.env.BASE_URL+url,{waitUntil:'domcontentloaded',timeout:12000});
              await page.waitForTimeout(2200);const state=await snapshot(page);console.log(`[${label}] ${JSON.stringify(state)}`);return {page,state};
            }
            let x=await open('first');if(x.state.shield||x.state.mainCount<1)process.exit(2);await x.page.close();
            await new Promise(r=>setTimeout(r,400));
            x=await open('second');if(x.state.shield||x.state.mainCount<1||!x.state.caches.includes('entego-v76'))process.exit(3);await x.page.close();

            const slow=await browser.newContext(device);const slowPage=await slow.newPage();
            await slowPage.route('**/assets/index.js',async route=>{await new Promise(r=>setTimeout(r,6000));await route.continue()});
            const start=Date.now();
            await slowPage.goto(process.env.BASE_URL+'/?slow-entry=76',{waitUntil:'commit',timeout:12000});
            await slowPage.waitForSelector('#entegoStaticShell',{state:'attached',timeout:1500});
            let state=await snapshot(slowPage);console.log(`[slow-js shell] ${Date.now()-start}ms ${JSON.stringify(state)}`);
            if(!state.staticShell||state.shield||!state.text.includes('Entertainment & Rental Marketplace'))process.exit(4);
            console.log('STATIC_SHELL_BEFORE_JS=PASS');
            await slow.close();

            const page=await context.newPage();
            await page.goto(process.env.BASE_URL+'/',{waitUntil:'domcontentloaded',timeout:12000});
            await page.evaluate(()=>localStorage.setItem('entego_route','profile'));
            await page.reload({waitUntil:'domcontentloaded',timeout:12000});await page.waitForTimeout(1800);
            state=await snapshot(page);if(state.shield||state.mainCount<1)process.exit(5);

            const registerTab=page.locator('#authRegisterTab');if(await registerTab.count()!==1)process.exit(6);await registerTab.click();
            const registerBtn=page.locator('#authRegisterBtn');if(await registerBtn.count()!==1)process.exit(7);await registerBtn.click();await page.waitForTimeout(150);
            const registerStatus=page.locator('#authRegisterStatus');
            if(await registerStatus.count()!==1||!(await registerStatus.isVisible())||!(await registerStatus.innerText()).includes('Nama wajib diisi'))process.exit(8);
            console.log('REGISTER_VALIDATION_VISIBLE=PASS');

            const payment=page.locator('.card').filter({hasText:'Metode pembayaran'}).first();if(await payment.count()!==1)process.exit(9);await payment.click();await page.waitForTimeout(150);
            let notice=page.locator('#entegoAccountRouteNotice');if(await notice.count()!==1||!(await notice.innerText()).includes('Metode Pembayaran'))process.exit(10);
            await page.locator('#arfClose').click();
            const admin=page.locator('.card').filter({hasText:'Admin Control Center'}).first();if(await admin.count()!==1)process.exit(11);await admin.click();await page.waitForTimeout(150);
            notice=page.locator('#entegoAccountRouteNotice');if(await notice.count()!==1||!(await notice.innerText()).includes('Akses Admin'))process.exit(12);
            console.log('ACCOUNT_MENU_TEST=PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
